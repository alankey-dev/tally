name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python -m unittest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tally .
      - name: Tests inside the image
        run: docker run --rm tally python -m unittest
      - name: Smoke test
        run: |
          docker run -d --name tally -p 8000:8000 -e TALLY_LAYOUT=example tally
          for attempt in $(seq 30); do curl -fsS -o /dev/null localhost:8000/ && break; sleep 1; done
          curl -fsS localhost:8000/locations | grep -q "Connectors &amp; wiring"
          curl -fsS localhost:8000/reports/inventory.pdf | head -c 4 | grep -q "%PDF"
      - if: failure()
        run: docker logs tally
