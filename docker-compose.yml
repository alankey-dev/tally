name: tally
services:
  tally:
    image: ghcr.io/alankey-dev/tally:latest
    build: .
    ports:
      - "${TALLY_PORT:-8000}:8000"
    environment:
      # Optional: a key is generated and kept in the data volume when this is empty.
      SECRET_KEY: ${SECRET_KEY:-}
      # Optional: "example" seeds a sample drawer layout on first run; leave empty to start blank.
      TALLY_LAYOUT: ${TALLY_LAYOUT:-}
    volumes:
      - tally-data:/data
    restart: unless-stopped

volumes:
  tally-data:
