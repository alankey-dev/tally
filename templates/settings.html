{% extends 'base.html' %}
{% from '_macros.html' import icon %}
{% block title %}{{sections[section]}} · Settings · Tally{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Settings</h1>
  </div>
</section>

<nav class="settings-nav" aria-label="Settings sections">
  <div class="segmented">
    {% for key, label in sections.items() %}
    <a href="{{url_for('settings', section=None if key == 'general' else key)}}"{% if key == section %} aria-current="true"{% endif %}>{{label}}</a>
    {% endfor %}
  </div>
</nav>

<section class="settings-page stack">
  {% include 'settings/' ~ section ~ '.html' %}
</section>
{% endblock %}
